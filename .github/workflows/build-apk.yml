name: Build APK

# Builds an installable APK on every push and leaves it as a downloadable
# artifact. Uses the devRelease build type, which is a release build without
# minification signed with the debug keystore, so no signing secrets are needed.

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - 'docs/**'
      - 'metadata/**'
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The project sets sourceCompatibility and jvmTarget to 21, so the Gradle
      # JVM has to be at least 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Ubuntu runner image already ships the Android SDK, so there is no
      # setup action to go stale. android-actions/setup-android@v3 is a Node 20
      # action and fails outright now that the runners force Node 24.
      - name: Locate the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "Using $sdkmanager_path"
          echo "SDKMANAGER=$sdkmanager_path" >> "$GITHUB_ENV"

      - name: Install SDK platform and build tools
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDevRelease

      - name: Report APK details
        run: |
          ls -lh app/build/outputs/apk/devRelease/
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA:0:8}\` on \`${GITHUB_REF_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"

      # Uploaded before the tests run, so a failing test still leaves something
      # installable behind.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foodyou-apk-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/devRelease/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDevReleaseUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
